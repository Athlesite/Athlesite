<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Athlesite</title><link rel="icon" href="assets/brand/athlesite-mark-on-light.svg"></head>
<body>
<!--
  Renders one athlete page full-screen, for review:
    site.html?a=jordan&look=editorial&palette=pitch
    site.html?ex=<slug>   (a homepage example, examples/<slug>.json)
    &cover= &stats= &gallery=folio &film=reel|list   (layouts)
    site.html?a=jordan&design={…json…}   (a whole design, as sent by the review page)
    &static=1 settles all motion for screenshots; &intro=never|always
    &embed=1 when shown inside another page's phone (homepage Section 02): no scrollbar, as on a phone
    &view=public   only what a published page may show today (the product's 18 public fields + design)
    &view=minor    the same with the minor rules: first name + last initial, no city, height or weight
-->
<script src="src/sports.js"></script>
<script src="src/profile.js"></script>
<script src="src/color.js"></script>
<script src="src/render.js"></script>
<script src="src/looks/cinematic.js"></script>
<script src="src/looks/editorial.js"></script>
<script src="src/looks/highlight.js"></script>
<script src="src/looks/portrait.js"></script>
<script src="src/looks/prospect.js"></script>
<script src="src/athletes.js"></script>
<script src="examples/examples.js"></script>
<script src="src/public-view.js"></script>
<script>
  const A = window.Athlesite, q = new URLSearchParams(location.search);
  const EX = A.EXAMPLES || {};
  let p = structuredClone(EX[q.get('ex')] ? A.normalizeProfile(EX[q.get('ex')]) : A.ATHLETES[q.get('a')] || A.ATHLETES.jordan);
  if (q.get('design')) {
    // A full design from the review page, passed through the same validation as stored data.
    try { p = A.normalizeProfile({ data: p.data, design: Object.assign({}, p.design, JSON.parse(q.get('design'))) }); } catch (e) {}
  }
  if (A.LOOKS[q.get('look')]) { p.design.look = q.get('look'); p.design.palette = ''; }
  if (!A.LOOKS[p.design.look]) p.design.look = 'cinematic';
  if (q.get('palette')) p.design.palette = q.get('palette');
  for (const k of ['type', 'photo', 'accent']) if (q.get(k) !== null) p.design[k] = q.get(k);
  for (const k of ['cover', 'stats', 'gallery', 'film']) if (q.get(k) !== null) p.design.layout[k] = q.get(k);
  const view = q.get('view');
  if (view === 'public' || view === 'minor') p = A.publicView(p, view === 'minor' ? 'minor' : 'adult');
  // Previews play the opening on every load; real sites use 'session' (once per visit).
  let html = A.renderSite(p, { intro: q.get('static') ? 'never' : (q.get('intro') || 'always') });
  // static=1 settles every animation, for screenshots and review.
  if (q.get('static')) html = html.replace('</head>', '<style>.js [data-reveal]{opacity:1!important;transform:none!important;transition:none!important}*,*::before,*::after{animation:none!important}</style></head>');
  // A review label, so the reduced view is never mistaken for the full design.
  if ((view === 'public' || view === 'minor') && !q.get('embed')) {
    const label = view === 'minor' ? 'Minor, published today: first name + last initial, no city, height or weight' : 'Published today: only the product’s public fields';
    html = html.replace('</body>', `<p role="note" style="position:fixed;left:12px;bottom:12px;z-index:999;margin:0;padding:8px 12px;border-radius:999px;background:#111;color:#fff;font:500 12px/1.3 system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)">${label}</p></body>`);
  }
  // embed=1: inside a drawn phone a desktop browser would show its own scrollbar (and keep its gutter).
  if (q.get('embed')) html = html.replace('</head>', '<style>html{scrollbar-width:none}</style></head>');
  document.open();
  document.write(html);
  document.close();
  // at=stats jumps straight to a section (for review screenshots).
  // Waits for fonts and photos, which change the page height, then jumps (and once more to be sure).
  if (q.get('at')) {
    const jump = () => { const el = document.getElementById(q.get('at')); if (el) { document.documentElement.style.scrollBehavior = 'auto'; scrollTo(0, el.offsetTop - 64); } };
    Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))]).then(() => { jump(); setTimeout(jump, 300); });
  }
</script>
</body></html>
