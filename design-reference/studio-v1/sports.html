<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athlesite Studio — Sport setup review</title>
<link rel="icon" href="assets/brand/athlesite-mark-on-light.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1EC;--paper:#FBFAF7;--ink:#0B0B0F;--muted:#6E7178;--line:#DAD6CE;--blue:#2563EB;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.bar img{height:22px}
.tag{font:500 11px/1 "Geist Mono",monospace;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:4px 7px;border:1px solid var(--line);border-radius:5px}
main{max-width:1200px;margin:0 auto;padding:28px 20px 64px}
h1{margin:0;font:400 clamp(34px,5vw,52px)/1 "Instrument Serif",serif}
h1 em{color:var(--blue)}
.lede{margin:10px 0 24px;color:var(--muted);max-width:62ch}
.label{display:block;margin:0 0 8px;font:500 11px/1 "Geist Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Chip rows: the selected chip's dark pill slides between options instead of jumping. */
.chips{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;isolation:isolate}
.chips button{position:relative;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-weight:500;transition:color .25s var(--ease),border-color .25s,transform .18s var(--ease)}
.chips button:hover{border-color:#bdb7ab}
.chips button:active{transform:scale(.96)}
.chips button[aria-pressed=true]{color:#fff;border-color:transparent;background:transparent}
.chips .pill{position:absolute;left:0;top:0;z-index:-1;border-radius:999px;background:var(--ink);pointer-events:none;transition:transform .42s var(--spring),width .42s var(--spring),height .3s var(--ease),opacity .2s}
.chips .all{color:var(--muted)}
.chips.is-new button{animation:chip-in .45s var(--ease) both;animation-delay:calc(var(--i) * 22ms)}
@keyframes chip-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.none-note{font:500 12px/1 "Geist Mono",monospace;color:var(--muted);padding:9px 0}

/* Level toggle */
.seg{position:relative;display:inline-flex;padding:3px;margin-bottom:20px;background:var(--paper);border:1px solid var(--line);border-radius:12px;isolation:isolate}
.seg button{position:relative;padding:8px 16px;border:0;background:none;font-weight:500;color:var(--muted);border-radius:9px;transition:color .25s var(--ease)}
.seg button[aria-pressed=true]{color:#fff}
.seg .pill{position:absolute;top:0;left:0;z-index:-1;border-radius:9px;background:var(--ink);transition:transform .42s var(--spring),width .42s var(--spring)}

.words{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 24px}
.words span{padding:6px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-size:13px}
.words b{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 16px 10px}
.card h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 4px;font:600 15px/1.2 Geist,sans-serif}
.card p.sub{margin:0 0 10px;font-size:12px;color:var(--muted)}
.card ul{list-style:none;margin:0;padding:0}
.card li label{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.card li:first-child label{border-top:0}
.card .opt{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.card .none{padding:8px 0 10px;color:var(--muted);font-size:13px}
.count{font:500 12px/1 "Geist Mono",monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.cols{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px}
.cols span{font:500 12px/1 "Geist Mono",monospace;padding:6px 8px;border-radius:6px;background:var(--bg)}
.badges{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px}
.badges span{font-size:12px;padding:5px 9px;border-radius:999px;background:color-mix(in srgb,var(--blue) 10%,var(--paper));color:var(--blue);border:1px solid color-mix(in srgb,var(--blue) 30%,transparent)}

/* Checkboxes that feel physical */
.check{appearance:none;width:18px;height:18px;margin:0;flex-shrink:0;border:1.5px solid #c9c3b6;border-radius:5px;background:var(--paper);display:grid;place-items:center;transition:background .2s var(--ease),border-color .2s,transform .15s var(--ease)}
.check::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .25s var(--spring)}
.check:checked{background:var(--blue);border-color:var(--blue)}
.check:checked::after{transform:rotate(-45deg) scale(1)}
.check:active{transform:scale(.9)}

/* Content changes: cards keep their place and smoothly change height; items fade up
   with a light stagger. Nothing covers the page, so every click lands. */
.card{overflow:hidden}
.card.is-resizing{transition:height .36s var(--ease)}
.card .fresh{animation:item-in .34s var(--ease) both;animation-delay:calc(var(--i,0) * 16ms)}
@keyframes item-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.words span{transition:opacity .2s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="bar"><img src="assets/brand/athlesite-wordmark-on-light.png" alt="Athlesite"><span class="tag">Studio · Sport setup review</span></header>
<main>
  <h1>What each sport <em>suggests</em></h1>
  <p class="lede">Pick a level, sport and position to see the checklist an athlete gets. Ticked items start on; everything is optional and athletes can add their own. Flag anything a real player or coach would find wrong or missing.</p>

  <div class="seg" id="levels" role="group" aria-label="Level"><span class="pill" aria-hidden="true"></span></div>
  <span class="label">Sport</span>
  <div class="chips" id="sports" role="group" aria-label="Sport"><span class="pill" aria-hidden="true"></span></div>
  <span class="label">Position</span>
  <div class="chips" id="positions" role="group" aria-label="Position"><span class="pill" aria-hidden="true"></span></div>

  <div class="words" id="words"></div>
  <div class="grid" id="grid"></div>
</main>

<script src="src/sports.js"></script>
<script>
(function () {
  const A = window.Athlesite, C = A.SPORT_CATALOG;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ORDER = ['football', 'basketball', 'baseball', 'softball', 'soccer', 'volleyball', 'track', 'swimming', 'hockey', 'wrestling', 'lacrosse', 'rowing', 'golf', 'tennis', 'pickleball', 'other'];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = { level: 'hs', sport: 'football', pos: 'wr' };

  // Each row keeps its pill element; buttons sit after it.
  const setButtons = (row, html) => { row.querySelectorAll('button,.none-note').forEach((b) => b.remove()); row.insertAdjacentHTML('beforeend', html); };

  /** Slide the row's pill under its pressed button. First placement doesn't animate. */
  function movePill(row, instant) {
    const pill = row.querySelector('.pill'), on = row.querySelector('button[aria-pressed=true]');
    if (!pill) return;
    if (!on) { pill.style.opacity = 0; return; }
    if (instant) pill.style.transition = 'none';
    pill.style.opacity = 1;
    pill.style.width = on.offsetWidth + 'px';
    pill.style.height = on.offsetHeight + 'px';
    pill.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
    if (instant) { pill.offsetWidth; pill.style.transition = ''; }
  }

  function press(row, attr, value) {
    row.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset[attr] || '') === (value || ''))));
    movePill(row);
  }

  function renderPositions(animate) {
    const row = $('#positions'), positions = C[state.sport].positions;
    setButtons(row, positions.length
      ? [`<button class="all" data-pos="" style="--i:0">No position</button>`, ...positions.map((p, i) => `<button data-pos="${p.id}" style="--i:${i + 1}">${esc(p.label)}</button>`)].join('')
      : '<span class="none-note">No positions in this sport.</span>');
    row.classList.remove('is-new');
    if (animate) { row.offsetWidth; row.classList.add('is-new'); }
    press(row, 'pos', state.pos);
    movePill(row, true);
  }

  // Each card is built in place; items get a stagger index for their fade-in.
  const item = (i, html) => `<li class="fresh" style="--i:${i}">${html}</li>`;
  function checklist(id, title, sub, items) {
    const on = items.filter((i) => i.checked).length;
    return `<h2>${title}<span class="count" data-count="${id}">${on} of ${items.length} on</span></h2><p class="sub">${sub}</p>
      ${items.length ? `<ul>${items.map((x, i) => item(i, `<label><input class="check" type="checkbox" data-group="${id}" ${x.checked ? 'checked' : ''}>${esc(x.label)}</label>`)).join('')}</ul>` : '<p class="none fresh">Nothing suggested. Athletes add their own.</p>'}`;
  }
  const CARDS = {
    stats: (g) => checklist('stats', 'Stats', 'Season numbers', g.stats),
    measurables: (g) => checklist('measurables', 'Measurables', 'Testing and combine numbers', g.measurables),
    details: (g) => `<h2>Profile details</h2><p class="sub">Facts on the page</p>${g.details.length ? `<ul>${g.details.map((d, i) => item(i, `<label>${esc(d.label)}<span class="opt">${d.options ? esc(d.options.join(' / ')) : 'their words'}</span></label>`)).join('')}</ul>` : '<p class="none fresh">None for this sport.</p>'}`,
    statuses: (g) => `<h2>Status badges</h2><p class="sub">Shown only if the athlete turns them on</p><div class="badges">${g.statuses.map((x, i) => `<span class="fresh" style="--i:${i}">${esc(x.label)}</span>`).join('')}</div>`,
    links: (g) => checklist('links', 'Profile links', 'Recruiting and results sites', g.links),
    results: (g) => `<h2>Results table</h2><p class="sub">${g.results ? esc(g.results.title) : 'Not used for this sport'}</p>${g.results ? `<div class="cols">${g.results.columns.map((c, i) => `<span class="fresh" style="--i:${i}">${esc(c)}</span>`).join('')}</div>` : '<p class="none fresh">Stat cards cover this sport.</p>'}`,
  };

  /** Swap a card's inside and glide its height from old to new (picks up mid-glide on fast clicks). */
  function resize(card, html) {
    const from = card.getBoundingClientRect().height;
    card.classList.remove('is-resizing');
    card.style.height = '';
    card.innerHTML = html;
    if (reduced || !from) return;
    const to = card.getBoundingClientRect().height;
    if (Math.abs(to - from) < 1) return;
    card.style.height = from + 'px';
    card.offsetHeight; // commit the starting height
    card.classList.add('is-resizing');
    card.style.height = to + 'px';
    clearTimeout(card._done);
    card._done = setTimeout(() => { card.classList.remove('is-resizing'); card.style.height = ''; }, 380);
  }

  function renderContent() {
    const g = A.suggestFor(state.sport, state.pos, state.level);
    $('#words').innerHTML = `<span>Stats section: <b>${esc(g.words.stats)}</b></span><span>Video section: <b>${esc(g.words.film)}</b></span><span>Jersey number <b>${g.number ? 'shown' : 'hidden'}</b></span>`;
    const grid = $('#grid');
    for (const [id, build] of Object.entries(CARDS)) {
      let card = grid.querySelector(`[data-card="${id}"]`);
      if (!card) { card = document.createElement('section'); card.className = 'card'; card.dataset.card = id; grid.appendChild(card); }
      resize(card, build(g));
    }
  }

  // Updates are immediate; the motion is all CSS, so nothing ever blocks a click.
  const change = (fn) => fn();

  // Build the static rows once.
  setButtons($('#levels'), Object.entries(A.LEVELS).map(([k, l]) => `<button data-level="${k}">${esc(l.label)}</button>`).join(''));
  setButtons($('#sports'), ORDER.map((k, i) => `<button data-sport="${k}" style="--i:${i}">${esc(C[k].label)}</button>`).join(''));
  press($('#levels'), 'level', state.level); movePill($('#levels'), true);
  press($('#sports'), 'sport', state.sport); movePill($('#sports'), true);
  renderPositions(false);
  renderContent();

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.level && b.dataset.level !== state.level) {
      state.level = b.dataset.level;
      press($('#levels'), 'level', state.level);
      change(renderContent);
    } else if (b.dataset.sport && b.dataset.sport !== state.sport) {
      state.sport = b.dataset.sport;
      state.pos = C[state.sport].positions[0]?.id || '';
      press($('#sports'), 'sport', state.sport);
      change(() => { renderPositions(true); renderContent(); });
    } else if ('pos' in b.dataset && b.dataset.pos !== state.pos) {
      state.pos = b.dataset.pos;
      press($('#positions'), 'pos', state.pos);
      change(renderContent);
    }
  });

  // Ticking updates the card's count live.
  document.addEventListener('change', (e) => {
    const group = e.target.dataset.group;
    if (!group) return;
    const boxes = [...document.querySelectorAll(`.check[data-group="${group}"]`)];
    document.querySelector(`[data-count="${group}"]`).textContent = `${boxes.filter((b) => b.checked).length} of ${boxes.length} on`;
  });

  // Pills follow their buttons when the layout reflows.
  addEventListener('resize', () => ['#levels', '#sports', '#positions'].forEach((s) => movePill($(s), true)));
  document.fonts?.ready.then(() => ['#levels', '#sports', '#positions'].forEach((s) => movePill($(s), true)));
})();
</script>
</body>
</html>
